<svg xmlns="http://www.w3.org/2000/svg" width="560" height="140" viewBox="0 0 560 140">
  <!-- SynthAudit logo: a data table under a magnifier that reveals an equation -->
  <g fill="none" stroke="#0072B2" stroke-width="6">
    <rect x="14" y="22" width="96" height="96" rx="12"/>
    <line x1="14" y1="54" x2="110" y2="54"/>
    <line x1="14" y1="86" x2="110" y2="86"/>
    <line x1="46" y1="22" x2="46" y2="118"/>
    <line x1="78" y1="22" x2="78" y2="118"/>
  </g>
  <circle cx="96" cy="96" r="30" fill="#ffffff" fill-opacity="0.92" stroke="#D55E00" stroke-width="7"/>
  <line x1="117" y1="117" x2="138" y2="138" stroke="#D55E00" stroke-width="9" stroke-linecap="round"/>
  <text x="96" y="103" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic"
        text-anchor="middle" fill="#D55E00">y=f(x)</text>
  <text x="160" y="78" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#1a252f">Synth<tspan fill="#0072B2">Audit</tspan></text>
  <text x="162" y="106" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#5a6570">audit synthetic datasets before you benchmark on them</text>
</svg>
