services:
  selftest:
    build: .
    command: python -m synthaudit selftest

  audit:
    build: .
    command: >
      python -m synthaudit audit datasets/grid_stability.csv
      --target stabf --name grid_stability --html /out/grid_report.html
    volumes:
      - ./out:/out

  notebooks:
    build: .
    command: >
      sh -c "pip install --no-cache-dir jupyterlab &&
             jupyter lab --ip 0.0.0.0 --port 8888 --allow-root --no-browser
             --NotebookApp.token=''"
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/app/notebooks
